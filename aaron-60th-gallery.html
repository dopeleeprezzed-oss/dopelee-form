<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aaron's 60th Birthday | Photo Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: #0a0a0a;
  color: #f5f5f0;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.hero {
  text-align: center;
  padding: 3rem 1.5rem 2rem;
  background: linear-gradient(180deg, rgba(180,20,20,0.15) 0%, rgba(10,10,10,0) 100%);
}

.hero-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #cc2020;
  border: 1px solid rgba(204,32,32,0.3);
  padding: 6px 16px;
  border-radius: 20px;
  margin-bottom: 1.5rem;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 0.5rem;
}

.hero h1 span { color: #cc2020; }

.hero p {
  font-size: 15px;
  color: rgba(245,245,240,0.6);
  margin-top: 0.5rem;
}

.photo-count {
  text-align: center;
  font-size: 13px;
  color: rgba(245,245,240,0.4);
  padding: 0 1.5rem 1.5rem;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  padding: 0 1rem 2rem;
}

.gallery-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  background: #1a1a1a;
  cursor: pointer;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}

.gallery-item:hover img {
  transform: scale(1.05);
}

.download-btn {
  position: absolute;
  bottom: 8px;
  right: 8px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.download-btn svg {
  width: 16px;
  height: 16px;
  stroke: #fff;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.lightbox.show { display: flex; }

.lightbox img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 8px;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-download {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 28px;
  background: #cc2020;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.loading {
  text-align: center;
  padding: 3rem;
  color: rgba(245,245,240,0.4);
  font-size: 14px;
}

.footer {
  text-align: center;
  padding: 2rem 1.5rem 3rem;
  border-top: 0.5px solid rgba(255,255,255,0.06);
}

.footer p {
  font-size: 12px;
  color: rgba(245,245,240,0.3);
  line-height: 1.6;
}

.footer .brand {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(245,245,240,0.2);
  margin-top: 1rem;
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">October 3, 2026</div>
  <h1><span>Aaron's</span> 60th Birthday</h1>
  <p>Photo Gallery</p>
</div>

<div class="photo-count" id="photoCount">Loading photos...</div>

<div class="gallery" id="gallery"></div>

<div class="loading" id="loading">Loading your photos...</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)">&#10005;</button>
  <img id="lightboxImg" src="" alt="Photo">
  <a class="lightbox-download" id="lightboxDownload" href="" download>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Save Photo
  </a>
</div>

<div class="footer">
  <p>All photos captured by guests at Aaron's 60th Birthday Celebration.</p>
  <div class="brand">Powered by Dopelee Prezzed by S</div>
</div>

<script>
const SUPABASE_URL = 'https://dyehxtiozfwlexkbalvn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5ZWh4dGlvemZ3bGV4a2JhbHZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4NDYxMzMsImV4cCI6MjA4MTQyMjEzM30.dxd7otsV6WzD6dt41sWkYdseW94BRn0WI8MtFCqnAIs';
const BUCKET = 'aarons-60th-party-photos';

async function loadGallery() {
  try {
    const response = await fetch(SUPABASE_URL + '/storage/v1/object/list/' + BUCKET + '/uploads', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ prefix: '', limit: 200, offset: 0, sortBy: { column: 'created_at', order: 'desc' } })
    });

    if (!response.ok) {
      var errText = await response.text();
      document.getElementById('loading').textContent = 'API Error ' + response.status + ': ' + errText;
      return;
    }
    const files = await response.json();
    console.log('Files returned:', JSON.stringify(files));
    var gallery = document.getElementById('gallery');
    var loading = document.getElementById('loading');
    var photoCount = document.getElementById('photoCount');

    var images = files.filter(function(f) {
      if (!f.name || f.name.startsWith('.') || f.id === null) return false;
      var ext = f.name.split('.').pop().toLowerCase();
      var imgExts = ['jpg','jpeg','png','gif','webp','heic','heif','bmp','tiff'];
      if (f.metadata && f.metadata.mimetype) {
        return f.metadata.mimetype.startsWith('image/');
      }
      return imgExts.indexOf(ext) !== -1;
    });

    loading.style.display = 'none';

    if (images.length === 0) {
      photoCount.textContent = 'No photos uploaded yet.';
      return;
    }

    photoCount.textContent = images.length + (images.length === 1 ? ' photo' : ' photos') + ' from the celebration';

    images.forEach(function(file, i) {
      var url = SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/uploads/' + encodeURIComponent(file.name);

      var item = document.createElement('div');
      item.className = 'gallery-item';
      item.onclick = function() { openLightbox(url); };

      var img = document.createElement('img');
      img.src = url;
      img.alt = 'Party photo ' + (i + 1);
      img.loading = 'lazy';

      var btn = document.createElement('button');
      btn.className = 'download-btn';
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
      btn.onclick = function(e) {
        e.stopPropagation();
        var a = document.createElement('a');
        a.href = url;
        a.download = file.name;
        a.click();
      };

      item.appendChild(img);
      item.appendChild(btn);
      gallery.appendChild(item);
    });

  } catch (err) {
    console.error('Gallery load error:', err);
    document.getElementById('loading').textContent = 'Error: ' + err.message;
  }
}

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxDownload').href = url;
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox(e) {
  if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-close')) {
    document.getElementById('lightbox').classList.remove('show');
  }
}

window.addEventListener('DOMContentLoaded', loadGallery);
</script>
</body>
</html>
